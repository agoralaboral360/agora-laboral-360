<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágora Laboral 360° | Consultoría &amp; Riesgo Normativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-mint-light: #6ECCA9;  /* Verde menta claro de acento */
            /* Degradado verde menta transparente de izquierda a derecha */
            --green-gradient-start: rgba(90, 175, 150, 0.85); 
            --green-gradient-end: rgba(135, 210, 185, 0.55);   
            --text-dark: #222222;
            --text-gray: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: var(--text-dark);
        }

        /* HEADER SOBRIO Y LIMPIO */
        header {
            position: sticky;
            top: 0;
            background-color: #FFFFFF;
            height: 95px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EFEFEF;
            z-index: 1000;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-bracket {
            width: 14px;
            height: 48px;
            border-left: 5px solid var(--green-mint-light);
            border-bottom: 5px solid var(--green-mint-light);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text .main-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #222222;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .logo-text .sub-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888888;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* NAVEGACIÓN NATIVA */
        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding-bottom: 8px;
            position: relative;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--green-mint-light);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background-color: var(--green-mint-light);
            border-radius: 2px;
        }

        /* HERO PORTADA CON DEGRADADO VERDE Y FOTO EJECUTIVA CREADA */
 .hero-banner {
    position: relative;
    width: 100%;
    height: 500px;
    background: linear-gradient(110deg, rgba(90, 175, 150, 0.70) 0%, rgba(135, 210, 185, 0.40) 100%), 
                url('image_f91a2f.jpg') center/cover no-repeat;
    display: flex;
    align-items: center;
    padding: 0 8%;
}

.hero-content h1 {
    color: #FFFFFF !important;
    font-size: 3.8rem;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -1px;
    margin-bottom: 16px;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
}

.hero-content p {
    color: #FFFFFF !important;
    font-size: 1.3rem;
    font-weight: 400;
    opacity: 0.98;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
}
            font-size: 1.3rem;
            font-weight: 400;
            opacity: 0.98;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }

        @media (max-width: 900px) {
            header { padding: 0 4%; }
            nav ul { gap: 18px; }
            .hero-content h1 { font-size: 2.6rem; }
            .hero-content p { font-size: 1.1rem; }
        }

        @media (max-width: 768px) {
            nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER DE ÁGORA LABORAL 360° -->
    <header>
        <div class="logo-box">
            <div class="logo-bracket"></div>
            <div class="logo-text">
                <span class="main-title">ÁGORA LABORAL 360°</span>
                <span class="sub-title">CONSULTORÍA &amp; RIESGO NORMATIVO</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">INICIO</a></li>
                <li><a href="#">SERVICIOS</a></li>
                <li><a href="#">RECURSOS ▾</a></li>
                <li><a href="#">MÉTODO 360°</a></li>
                <li><a href="#">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO BANNER CON FOTO EJECUTIVA EN VIVO -->
    <section class="hero-banner">
    <div class="hero-content">
        
        <p>Evaluamos, investigamos y diagnosticamos el nivel de cumplimiento normativo de su empresa bajo el estándar técnico del Método Ágora 360°.</p>
        <a href="#autodiagnostico" class="btn-hero-cta">🟠 REALIZAR AUTODIAGNÓSTICO GRATIS</a>
    </div>
</section>

</body>
</html>
