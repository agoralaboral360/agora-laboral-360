<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágora Laboral 360° | Observatorio Ley Karin</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-green-light: #7EE0C7;  /* Verde menta más claro y brillante */
            --brand-green-active: #50C8A8; /* Verde para estados activos y bordes */
            --header-bg: #FFFFFF;
            --text-nav: #444444;
            /* Filtro verdoso más claro con buena legibilidad para texto blanco */
            --hero-teal-overlay: rgba(75, 160, 145, 0.72); 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: #333333;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            height: 95px;
            padding: 0 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EFEFEF;
            z-index: 1000;
        }

        /* LOGO ÁGORA LABORAL 360° */
        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-symbol {
            width: 14px;
            height: 48px;
            border-left: 5px solid var(--brand-green-light);
            border-bottom: 5px solid var(--brand-green-light);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text .title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #222222;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .logo-text .subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888888;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* NAVEGACIÓN */
        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-nav);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding-bottom: 8px;
            position: relative;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--brand-green-active);
        }

        nav a.active {
            color: var(--brand-green-active);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background-color: var(--brand-green-light);
            border-radius: 2px;
        }

        /* HERO BANNER CON NUEVA FOTO LUMINOSA Y VERDE MÁS CLARO */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 480px;
            background: linear-gradient(var(--hero-teal-overlay), var(--hero-teal-overlay)), 
                        url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding: 0 8%;
        }

        .hero-content {
            color: #FFFFFF;
            max-width: 700px;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin-bottom: 15px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        .hero-content p {
            font-size: 1.35rem;
            font-weight: 400;
            opacity: 0.98;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 6px rgba(0,0,0,0.1);
        }

        @media (max-width: 900px) {
            header { padding: 0 4%; }
            nav ul { gap: 18px; }
            .hero-content h1 { font-size: 2.8rem; }
            .hero-content p { font-size: 1.1rem; }
        }

        @media (max-width: 768px) {
            nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-box">
            <div class="logo-symbol"></div>
            <div class="logo-text">
                <span class="title">ÁGORA LABORAL 360°</span>
                <span class="subtitle">CONSULTORÍA &amp; RIESGO NORMATIVO</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">INICIO</a></li>
                <li><a href="#">PRESENTACIÓN</a></li>
                <li><a href="#">RECURSOS ▾</a></li>
                <li><a href="#">NOTICIAS</a></li>
                <li><a href="#">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO PORTADA -->
    <section class="hero-banner">
        <div class="hero-content">
            <h1>Observatorio<br>Ley Karin</h1>
            <p>Una iniciativa de Ágora Laboral 360°</p>
        </div>
    </section>

</body>
</html>
