<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ágora Laboral 360°</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-accent: #6DB88A;        /* Verde menta/sabio exacto de la referencia */
            --green-hover: #57A273;
            --hero-overlay: rgba(105, 168, 156, 0.82); /* Overlay turquesa/verde suave transparente */
            --text-dark: #222222;
            --text-gray: #555555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: #FFFFFF;
            color: var(--text-dark);
        }

        /* HEADER SOBRIO Y LIMPIO */
        header {
            position: sticky;
            top: 0;
            background-color: #FFFFFF;
            height: 95px;
            padding: 0 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #EFEFEF;
            z-index: 1000;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-bracket {
            width: 14px;
            height: 48px;
            border-left: 5px solid var(--green-accent);
            border-bottom: 5px solid var(--green-accent);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text .main-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #222222;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .logo-text .sub-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888888;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* NAVEGACIÓN EN TEXTO SOBRIO CON SUBRAYADO VERDE */
        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding-bottom: 8px;
            position: relative;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--green-accent);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--green-accent);
            border-radius: 2px;
        }

        /* HERO PORTADA EXACTA A LA REFERENCIA */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 480px;
            background: linear-gradient(var(--hero-overlay), var(--hero-overlay)), 
                        url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            padding: 0 8%;
        }

        .hero-content {
            color: #FFFFFF;
            max-width: 750px;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            margin-bottom: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.08);
        }

        .hero-content p {
            font-size: 1.35rem;
            font-weight: 400;
            opacity: 0.95;
            letter-spacing: 0.2px;
        }

        @media (max-width: 900px) {
            header { padding: 0 4%; }
            nav ul { gap: 18px; }
            .hero-content h1 { font-size: 2.8rem; }
            .hero-content p { font-size: 1.1rem; }
        }

        @media (max-width: 768px) {
            nav { display: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER DE ÁGORA LABORAL 360° -->
    <header>
        <div class="logo-box">
            <div class="logo-bracket"></div>
            <div class="logo-text">
                <span class="main-title">ÁGORA LABORAL 360°</span>
                <span class="sub-title">CONSULTORÍA &amp; RIESGO NORMATIVO</span>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">INICIO</a></li>
                <li><a href="#">SERVICIOS</a></li>
                <li><a href="#">RECURSOS ▾</a></li>
                <li><a href="#">MÉTODO 360°</a></li>
                <li><a href="#">CONTACTO</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO BANNER TIPO REFERENCIA -->
    <section class="hero-banner">
        <div class="hero-content">
            <h1>Ágora Laboral<br>360°</h1>
            <p>Consultoría Especializada en Ley Karin y Ley de Equidad</p>
        </div>
    </section>

</body>
</html>
